[package]
name = "spdk-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "spdk-cli"
path = "src/main.rs"

[dependencies]
# Pinned to the same spdk commit silent-pay depends on, and that the baseline
# pins the "spdk" checkout to, so the validator and the MuSig2-SP legs check
# PSBTs with the same code. This crate is the harness's own wrapper; the
# cryptography stays in spdk, same split as caravan_validate.cjs (in-repo
# script) vs. Caravan's checkout. spdk pins rust-psbt by rev itself, and
# Cargo.lock (committed) fixes the rest.
psbt = { git = "https://github.com/macgyver13/spdk.git", rev = "5c8a3823d0addf6f481f81f86cb3f58604cab5d4" }
secp256k1 = "0.29.0"
serde_json = "1.0.107"
