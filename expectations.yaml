  bip376-coldcard-sp-spend-single:
    status: supported
    reason: passes
    reference: docs/runbook.md
  bip376-jade-two-way-sp-spend-to-p2tr:
    status: supported
    reason: passes since the sign_psbt.c fix that clears inputs/outputs-modifiable per BIP-370 after a plain-spend sign; not yet pinned, fix is uncommitted in the Jade fork
    reference: docs/runbook.md
  bip376-jade-two-way-sp-spend-to-p2wpkh:
    status: supported
    reason: passes since the sign_psbt.c fix that clears inputs/outputs-modifiable per BIP-370 after a plain-spend sign; not yet pinned, fix is uncommitted in the Jade fork
    reference: docs/runbook.md
  bip376-jade-two-way-sp-spend-to-sp:
    status: supported
    reason: passes, chained SP spend into a new SP output
    reference: docs/runbook.md
  bip376-seedsigner-coldcard-sp-spend-to-p2wpkh:
    status: supported
    reason: passes
    reference: docs/runbook.md
  bip376-seedsigner-jade-sp-spend-to-p2tr:
    status: supported
    reason: passes since the serialise_psbt fix that adds WALLY_PSBT_SERIALIZE_FLAG_REDUNDANT, preserving sighash_type on an already-finalized co-owned input; not yet pinned, fix is uncommitted in the Jade fork
    reference: docs/runbook.md
  bip376-seedsigner-jade-sp-spend-to-p2wpkh:
    status: supported
    reason: passes since the serialise_psbt fix that adds WALLY_PSBT_SERIALIZE_FLAG_REDUNDANT, preserving sighash_type on an already-finalized co-owned input; not yet pinned, fix is uncommitted in the Jade fork
    reference: docs/runbook.md
  bip376-seedsigner-jade-sp-spend-to-sp:
    status: unsupported
    reason: SeedSigner cannot produce an SP output (same limitation as bip375-seedsigner-jade-two-way)
    reference: docs/runbook.md
  bip376-seedsigner-sp-spend-single:
    status: supported
    reason: passes
    reference: docs/runbook.md
  frost-sp-reserved:
