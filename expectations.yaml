# Expected outcome per scenario for the pinned checkout revisions.
# status: supported | finding | unsupported | needs-external-psbt | unclassified
#   supported            passes end to end
#   finding              runs, but a device behaves in a way the harness records as a finding
#   unsupported          a known limitation blocks it
#   needs-external-psbt  cannot run in `check` without a PSBT from silent-pay and no
#                        verified run exists yet
#   unclassified         outcome not yet triaged; resolve on the stable-pin baseline run
# Seeded from the 2026-09-18 full run and docs/runbook.md. Tied to both baseline locks.
lock_sha256:
  baseline: sha256:b77fd8f8543ee5a1f7cb87e6f2d9124ecaf5e06a9b61a32056c7afd0390a850a
  baseline-musig2: sha256:b51583da4ebbfcbdc3aacbc9bf3f295d36003eab6acb54aa983c35e7dd00e845
interop_lab_allowed_findings:
  - bundled-js-rejects-unresolved
  - libwally-rejects-unresolved
  - rust-psbt-v2-adds-empty-script
  - libwally-drops-zero-tx-modifiable
scenarios:
  bip375-caravan-coldcard-jade-two-way:
    status: supported
    reason: passes, every snapshot also validated by Caravan
    reference: docs/runbook.md
  bip375-coldcard-jade-three-way:
    status: supported
    reason: passes, three signers across two backends without SeedSigner
    reference: docs/runbook.md
  bip375-coldcard-jade-two-way:
    status: supported
    reason: passes
    reference: docs/runbook.md
  bip375-coldcard-jade-two-way-taproot:
    status: supported
    reason: passes with both inputs P2TR
    reference: docs/runbook.md
  bip375-coldcard-two-way:
    status: supported
    reason: passes, same-backend
    reference: docs/runbook.md
  bip375-jade-two-way:
    status: supported
    reason: passes, same-backend
    reference: docs/runbook.md
  bip375-seedsigner-single:
    status: supported
    reason: passes
    reference: docs/runbook.md
  bip375-seedsigner-single-taproot:
    status: supported
    reason: passes with a P2TR key-path input
    reference: docs/runbook.md
  bip375-spdk-coldcard-jade-two-way:
    status: supported
    reason: passes, final PSBT also verified by the SPDK validator
    reference: docs/runbook.md
  bip375-coldcard-jade-two-way-redundant-sign:
    status: supported
    reason: passes, both devices return an already fully signed SP PSBT unchanged
    reference: docs/runbook.md
  bip375-coldcard-jade-two-way-taproot-sighash-default:
    status: supported
    reason: passes with Coldcard signing a SIGHASH_DEFAULT taproot input, Jade preserving that foreign field, and both validators accepting the snapshots
    reference: docs/runbook.md
  bip375-seedsigner-coldcard-two-way:
    status: unsupported
    reason: SeedSigner cannot co-own a plain BIP-375 send (multi-party SP sends unsupported)
    reference: docs/runbook.md
  bip375-seedsigner-jade-two-way:
    status: unsupported
    reason: SeedSigner cannot co-own a plain BIP-375 send (multi-party SP sends unsupported)
    reference: docs/runbook.md
  bip375-three-way:
    status: unsupported
    reason: blocked at seedsigner-c, multi-party SP sends unsupported
    reference: docs/runbook.md
  bip376-coldcard-jade-sp-spend-to-p2tr:
    status: supported
    reason: passes
    reference: docs/runbook.md
  bip376-coldcard-jade-sp-spend-to-p2wpkh:
    status: supported
    reason: passes
    reference: docs/runbook.md
  bip376-coldcard-jade-sp-spend-to-sp:
    status: supported
    reason: passes, chained SP spend into a new SP output
