# Stable-pin baseline. Checkouts either point at a frozen worktree (silent-pay,
# coldcard, spdk: their live checkouts move too fast to pin directly, and are not
# to be disturbed) or at the same live path as ../interop.yaml, pinned by whatever
# `pin` finds there at write time. See ../docs/regression-plan.md, "Baseline".
artifact_root: ../artifacts
allow_dirty: false
checkouts:
  silent-pay:
    path: ~/src/silent-pay-baseline
    revision: null
  bip375-test-generator:
    path: ~/src/bip375-test-generator
    revision: null
  coldcard:
    path: ~/src/coldcard-firmware-baseline
    revision: null
  jade:
    path: ~/src/Jade
    revision: null
  seedsigner:
    path: ~/src/seedsigner
    revision: null
  bitsaga-seedsigner:
    path: ~/src/bitsaga-seedsigner
    revision: null
  caravan:
    path: ~/src/caravan
    revision: null
  spdk:
    path: ~/src/spdk-baseline
    revision: null
  embit:
    path: ~/src/embit
    revision: null
