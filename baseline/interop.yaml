# Primary profile: the BIP-375 line of every repo. Checkout revisions are pinned by
# interop.lock. Live checkouts may move; `doctor` checks them before a run. See
# ../docs/regression-plan.md.
artifact_root: ../artifacts
allow_dirty: false
# BIP-375 line only; MuSig2-SP scenarios are judged by ../baseline-musig2.
suites: [bip375]
checkouts:
  silent-pay:
    path: ~/src/silent-pay
    revision: null
  coldcard:
    path: ~/src/coldcard-firmware
    revision: null
  jade:
    path: ~/src/Jade
    revision: null
  seedsigner:
    path: ~/src/seedsigner
    revision: null
  caravan:
    path: ~/src/caravan-baseline
    revision: null
  spdk:
    path: ~/src/spdk-baseline
    revision: null
  embit:
    path: ~/src/embit
    revision: null
