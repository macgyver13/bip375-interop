# Primary profile: the BIP-375 line of every repo. Checkouts either point at a frozen
# worktree (silent-pay, coldcard, jade, spdk: their live checkouts move too fast to pin
# directly, and are not to be disturbed) or at the same live path as ../interop.yaml,
# pinned by whatever `pin` finds there at write time. Jade and coldcard worktrees each
# need their own build (flash image, simulator). See ../docs/regression-plan.md.
artifact_root: ../artifacts
allow_dirty: false
# BIP-375 line only; MuSig2-SP scenarios are judged by ../baseline-musig2.
suites: [bip375]
checkouts:
  silent-pay:
    path: ~/src/silent-pay-baseline
    revision: null
  bip375-test-generator:
    path: ~/src/bip375-test-generator
    revision: null
  coldcard:
    path: ~/src/coldcard-firmware-sp-core
    revision: null
  jade:
    path: ~/src/Jade-sp-core
    revision: null
  seedsigner:
    path: ~/src/seedsigner
    revision: null
  bitsaga-seedsigner:
    path: ~/src/bitsaga-seedsigner
    revision: null
  caravan:
    path: ~/src/caravan-baseline
    revision: null
  spdk:
    path: ~/src/spdk-baseline
    revision: null
  embit:
    path: ~/src/embit
    revision: null
