# MuSig2 profile. Same checkouts as ../baseline/interop.yaml, except that each repo with
# a MuSig2 line (jade, coldcard) uses it here. MuSig2 work must not regress BIP-375, so
# this profile shares the primary profile's expectations.yaml (symlink) and runs the same
# `check`, plus the two MuSig2-SP regtest legs:
#   CONFIG=baseline-musig2/interop.yaml just musig2-regtest aggregate-then-derive
artifact_root: ../artifacts
allow_dirty: false
checkouts:
  silent-pay:
    path: ~/work/interop/baseline-musig2/silent-pay
    revision: null
  coldcard:
    path: ~/work/interop/baseline-musig2/coldcard-firmware
    revision: null
  jade:
    path: ~/work/interop/baseline-musig2/Jade
    revision: null
  seedsigner:
    path: ~/work/interop/baseline-musig2/seedsigner
    revision: null
  caravan:
    path: ~/work/interop/baseline-musig2/caravan
    revision: null
  spdk:
    path: ~/work/interop/baseline-musig2/spdk
    revision: null
  embit:
    path: ~/work/interop/baseline-musig2/embit
    revision: null
